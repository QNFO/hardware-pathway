<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Pathway Visualizer — QWAV</title>
<meta name="description" content="3D visualization of 40-atom neutral atom Bruhat-Tits tree layout with Rydberg blockade gates.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0A1128;color:#E5E5E5;font-family:system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{width:100%;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(129,140,248,0.2);z-index:1}
header a{color:#818CF8;text-decoration:none;font-size:.875rem}
h1{font-size:1.25rem;font-weight:600;color:#818CF8}
#viz{flex:1;position:relative}
#legend{position:absolute;bottom:1rem;left:1rem;background:rgba(10,17,40,0.9);border:1px solid rgba(129,140,248,0.2);border-radius:8px;padding:.75rem;font-size:.7rem;color:#9CA3AF;pointer-events:none}
.legend-item{display:flex;align-items:center;gap:.5rem;margin:.25rem 0}
.legend-dot{width:8px;height:8px;border-radius:50%}
footer{width:100%;padding:.5rem;text-align:center;border-top:1px solid rgba(129,140,248,0.1);font-size:.7rem}
footer a{color:#818CF8;text-decoration:none;margin:0 .5rem}
.note{position:absolute;top:1rem;left:50%;transform:translateX(-50%);font-size:.7rem;color:#6B7280;pointer-events:none}
</style>
</head>
<body>
<header>
<h1>Hardware Pathway — 40-Atom Neutral Atom Layout</h1>
<a href="https://qnfo.github.io/QWAV/">← Technical Site</a>
</header>
<div id="viz">
<div class="note">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
<div id="legend">
<div class="legend-item"><div class="legend-dot" style="background:#818CF8"></div> Atom (ground state)</div>
<div class="legend-item"><div class="legend-dot" style="background:#EF4444"></div> Rydberg state</div>
<div class="legend-item"><div class="legend-dot" style="background:#FBBF24"></div> Rydberg blockade gate</div>
<div class="legend-item"><span style="color:#9CA3AF">·</span> Tree edge (ternary structure)</div>
</div>
</div>
<footer>
<a href="https://qnfo.github.io/QWAV/">← Hub</a>
<span style="color:#4B5563;margin:0 4px">|</span>
<a href="https://qnfo.github.io/ultrametric-error-confinement/">Error Confinement</a>
<a href="https://qnfo.github.io/Q-PNA/">Q-PNA</a>
<a href="https://qnfo.github.io/ultrametric-convergence/">Convergence</a>
<a href="https://qnfo.github.io/tree-distance/">Tree Distance</a>
<a href="https://qnfo.github.io/hardware-pathway/" style="color:#34D399">Hardware</a>
<span style="color:#4B5563;margin:0 4px">|</span>
<a href="https://qwav.tech">qwav.tech</a>
<a href="https://github.com/QNFO/hardware-pathway">GitHub</a>
<a href="https://doi.org/10.5281/zenodo.20208437">DOI</a>
</footer>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Scene setup
const container = document.getElementById('viz');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0A1128);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.5, 30);
camera.position.set(8, 6, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;

// Lighting
scene.add(new THREE.AmbientLight(0x404060, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// Build ternary Bruhat-Tits tree: 40 atoms, p=3, depth 3
function buildTree(p=3, d=3) {
  const degree = p + 1;
  const nodes = [];
  const edges = [];
  const atoms = [];
  let nid = 0;
  
  function grow(parent, layer, remaining, x, y, z) {
    nid++;
    const node = {id: nid, layer, x, y, z, children: [], isLeaf: remaining <= 0};
    nodes.push(node);
    if (parent) edges.push({from: parent.id, to: node.id});
    
    if (remaining <= 0) {
      atoms.push(node);
      return;
    }
    
    // Place children in a circle in the XY plane, progressing along Z
    for (let i = 0; i < degree; i++) {
      const angle = (i / degree) * Math.PI * 2 + layer * 0.5;
      const radius = 1.8 / (layer + 1);
      const cx = x + Math.cos(angle) * radius;
      const cy = y + Math.sin(angle) * radius;
      const cz = z - 1.2;
      const child = {id: null, layer: layer + 1, x: cx, y: cy, z: cz, children: []};
      node.children.push(child);
      grow(node, layer + 1, remaining - 1, cx, cy, cz);
    }
  }
  
  grow(null, 0, d, 0, 0, 1.5);
  return {nodes, edges, atoms};
}

const tree = buildTree(3, 3);
console.log('Tree built: ' + tree.atoms.length + ' atoms, ' + tree.nodes.length + ' nodes');

// Draw tree edges (ternary structure)
const edgeGeo = new THREE.BufferGeometry();
const edgePts = [];
tree.edges.forEach(e => {
  const from = tree.nodes.find(n => n.id === e.from);
  const to = tree.nodes.find(n => n.id === e.to);
  if (from && to) {
    edgePts.push(from.x, from.y, from.z, to.x, to.y, to.z);
  }
});
edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePts, 3));
const edgeMat = new THREE.LineBasicMaterial({color: 0x4B5563, transparent: true, opacity: 0.3});
scene.add(new THREE.LineSegments(edgeGeo, edgeMat));

// Draw atoms
const atomGeom = new THREE.SphereGeometry(0.15, 16, 16);
const atomMat = new THREE.MeshStandardMaterial({color: 0x818CF8, roughness: 0.4, metalness: 0.6});
tree.atoms.forEach(atom => {
  const mesh = new THREE.Mesh(atomGeom, atomMat);
  mesh.position.set(atom.x, atom.y, atom.z);
  scene.add(mesh);
});

// Rydberg blockade gates: draw edges between atoms within blockade radius
const blockadeRadius = 1.5;
const gatePts = [];
for (let i = 0; i < tree.atoms.length; i++) {
  for (let j = i + 1; j < tree.atoms.length; j++) {
    const a = tree.atoms[i], b = tree.atoms[j];
    const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dist < blockadeRadius) {
      gatePts.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
  }
}
const gateGeo = new THREE.BufferGeometry();
gateGeo.setAttribute('position', new THREE.Float32BufferAttribute(gatePts, 3));
const gateMat = new THREE.LineBasicMaterial({color: 0xFBBF24, transparent: true, opacity: 0.5, linewidth: 1});
scene.add(new THREE.LineSegments(gateGeo, gateMat));

// Add some Rydberg-state atoms (excited)
const rydbergGeom = new THREE.SphereGeometry(0.2, 16, 16);
const rydbergMat = new THREE.MeshStandardMaterial({color: 0xEF4444, roughness: 0.4, metalness: 0.6, emissive: 0x440000});
// Make every 4th atom Rydberg-excited
for (let i = 3; i < tree.atoms.length; i += 4) {
  const atom = tree.atoms[i];
  const mesh = new THREE.Mesh(rydbergGeom, rydbergMat);
  mesh.position.set(atom.x, atom.y, atom.z);
  scene.add(mesh);
}

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
